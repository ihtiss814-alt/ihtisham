    <!--
      Google Fonts — loaded non-blocking so it never delays first paint.
      The media="print" trick: browser fetches it low-priority, then
      onload flips it to media="all" making it apply without blocking render.
    -->
    <!--
      Google Fonts — non-blocking via media="print" trick so fonts never delay first paint.
      DM Sans (body), Fraunces (headings), and Space Mono (reference data) loaded together.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400..700&family=Space+Mono:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400..700&family=Space+Mono:wght@400;700&display=swap" />
      <!-- Scroll-reveal sections start transparent and are un-hidden by JS.
           Without scripting they must still be readable. -->
      <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
    </noscript>

    <!--
      Critical inline CSS: system font stack prevents FOUT before Google Fonts arrive.
      Fraunces falls back to a system serif, DM Sans falls back to system-ui.
    -->
    <style>
      body { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; }
      h1,h2,h3,h4,h5,h6 { font-family: 'Fraunces', ui-serif, Georgia, serif; }
    </style>
