name: Wazir Trading quality checks and source ZIP

on:
  push:
    branches:
      - main
      - performance-final-pass
      - ux/destination-led-journey
      - ux/professional-inventory-experience
      - quality/trust-and-enquiry-reliability
      - ux/whatsapp-first-enquiries-main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format WhatsApp-first enquiry branch before verification
        if: github.event_name == 'pull_request' && github.head_ref == 'ux/whatsapp-first-enquiries-main'
        run: |
          git fetch origin ux/whatsapp-first-enquiries-main
          git checkout -B ux/whatsapp-first-enquiries-main origin/ux/whatsapp-first-enquiries-main
          npx prettier --write src/lib/whatsapp-enquiries.ts src/pages/request-a-quote.tsx src/pages/contact.tsx src/pages/car-detail.tsx src/pages/privacy-policy.tsx src/components/CarCard.tsx src/pages/about.tsx scripts/validate-enquiry-reliability.mjs scripts/validate-business-credibility.mjs package.json
          git add -- src/lib/whatsapp-enquiries.ts src/pages/request-a-quote.tsx src/pages/contact.tsx src/pages/car-detail.tsx src/pages/privacy-policy.tsx src/components/CarCard.tsx src/pages/about.tsx scripts/validate-enquiry-reliability.mjs scripts/validate-business-credibility.mjs package.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Format WhatsApp-first enquiry and privacy changes"
            git push origin HEAD:ux/whatsapp-first-enquiries-main
          fi

      - name: Format destination journey source and commit on branch pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/ux/destination-led-journey'
        run: |
          npx prettier --write scripts/validate-destination-journey.mjs scripts/validate-performance-optimizations.mjs src/components/Navbar.tsx src/components/DestinationFields.tsx src/components/DestinationPreferenceControl.tsx src/lib/destination-links.ts src/lib/seo-bootstrap.ts src/lib/shipping.ts src/pages/car-detail.tsx src/pages/cars.tsx src/pages/contact.tsx src/pages/home.tsx src/pages/request-a-quote.tsx src/pages/vehicle-landing-pages.tsx
          git add -- scripts/validate-destination-journey.mjs scripts/validate-performance-optimizations.mjs src/components/Navbar.tsx src/components/DestinationFields.tsx src/components/DestinationPreferenceControl.tsx src/lib/destination-links.ts src/lib/seo-bootstrap.ts src/lib/shipping.ts src/pages/car-detail.tsx src/pages/cars.tsx src/pages/contact.tsx src/pages/home.tsx src/pages/request-a-quote.tsx src/pages/vehicle-landing-pages.tsx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Format destination-aware customer journey changes"
            git push origin HEAD:ux/destination-led-journey
          fi

      - name: Format changed performance source and commit on branch pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/performance-final-pass'
        run: |
          npx prettier --write src/App.tsx src/components/CarCard.tsx src/components/VehiclePhotoGallery.tsx src/lib/homepage-inventory-cache.ts src/lib/image-delivery.ts src/pages/home.tsx src/pages/cars.tsx src/pages/contact.tsx src/pages/payment-information.tsx src/routes/index.tsx src/routes/__root.tsx scripts/validate-performance-optimizations.mjs vercel.json
          git add -- src/App.tsx src/components/CarCard.tsx src/components/VehiclePhotoGallery.tsx src/lib/homepage-inventory-cache.ts src/lib/image-delivery.ts src/pages/home.tsx src/pages/cars.tsx src/pages/contact.tsx src/pages/payment-information.tsx src/routes/index.tsx src/routes/__root.tsx scripts/validate-performance-optimizations.mjs vercel.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Format final performance optimization changes"
            git push origin HEAD:performance-final-pass
          fi

      - name: Format professional inventory experience source
        if: github.event_name == 'push' && github.ref == 'refs/heads/ux/professional-inventory-experience'
        run: |
          npx prettier --write src/pages/cars.tsx src/pages/cars.css src/components/CarCard.tsx scripts/validate-inventory-experience.mjs package.json
          git add -- src/pages/cars.tsx src/pages/cars.css src/components/CarCard.tsx scripts/validate-inventory-experience.mjs package.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Format professional inventory experience"
            git push origin HEAD:ux/professional-inventory-experience
          fi

      - name: Format and commit reliability hardening source
        if: github.event_name == 'push' && (github.ref == 'refs/heads/quality/trust-and-enquiry-reliability' || github.ref == 'refs/heads/ux/whatsapp-first-enquiries-main')
        run: |
          npx prettier --write src/lib/public-inquiries.ts src/lib/whatsapp-enquiries.ts src/pages/request-a-quote.tsx src/pages/contact.tsx src/pages/car-detail.tsx src/pages/cars.tsx src/pages/cars.css src/components/CarCard.tsx src/pages/about.tsx src/components/ShippingRouteCanvas.tsx scripts/validate-enquiry-reliability.mjs scripts/validate-inventory-reliability.mjs scripts/validate-business-credibility.mjs scripts/validate-inventory-experience.mjs package.json
          git add -- src/lib/public-inquiries.ts src/lib/whatsapp-enquiries.ts src/pages/request-a-quote.tsx src/pages/contact.tsx src/pages/car-detail.tsx src/pages/cars.tsx src/pages/cars.css src/components/CarCard.tsx src/pages/about.tsx src/components/ShippingRouteCanvas.tsx scripts/validate-enquiry-reliability.mjs scripts/validate-inventory-reliability.mjs scripts/validate-business-credibility.mjs scripts/validate-inventory-experience.mjs package.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Format enquiry and trust reliability changes"
            if [[ "${GITHUB_REF_NAME}" == "ux/whatsapp-first-enquiries-main" ]]; then
              git push origin HEAD:ux/whatsapp-first-enquiries-main
            else
              git push origin HEAD:quality/trust-and-enquiry-reliability
            fi
          fi

      - name: TypeScript validation
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Validate country landing pages
        run: npm run validate:country-pages

      - name: Validate vehicle landing pages
        run: npm run validate:vehicle-pages

      - name: Validate destination and inquiry journey
        run: npm run validate:destination-journey

      - name: Validate professional inventory experience
        run: npm run validate:inventory-experience

      - name: Validate WhatsApp-first enquiry flow
        run: npm run validate:whatsapp-enquiries

      - name: Validate inventory reliability
        run: npm run validate:inventory-reliability

      - name: Validate business credibility
        run: npm run validate:business-credibility

      - name: Validate vehicle detail redesign
        run: node scripts/validate-vehicle-detail-redesign.mjs

      - name: Validate performance optimizations
        run: node scripts/validate-performance-optimizations.mjs

      - name: Production build
        run: npm run build

      - name: Create complete source ZIP
        run: git archive --format=zip --output=Wazir-Trading-Performance-Edition.zip HEAD

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Wazir-Trading-Performance-Edition
          path: Wazir-Trading-Performance-Edition.zip
          if-no-files-found: error
          retention-days: 30
