name: Performance edition validation and ZIP

on:
  push:
    branches: [performance-instant-navigation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format performance changes and commit formatting
        run: |
          npx prettier --write src/App.tsx src/components/Navbar.tsx src/lib/inventory-cache.ts src/lib/request-cache.ts src/lib/shipping.ts src/lib/vehicle-request-cache.ts src/pages/car-detail.tsx src/pages/cars.tsx src/router.tsx src/routes/__root.tsx scripts/validate-vehicle-detail-redesign.mjs
          git add -- src/App.tsx src/components/Navbar.tsx src/lib/inventory-cache.ts src/lib/request-cache.ts src/lib/shipping.ts src/lib/vehicle-request-cache.ts src/pages/car-detail.tsx src/pages/cars.tsx src/router.tsx src/routes/__root.tsx scripts/validate-vehicle-detail-redesign.mjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Format performance optimization changes"
            git push origin HEAD:performance-instant-navigation
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate:country-pages
      - run: npm run validate:vehicle-pages
      - run: node scripts/validate-vehicle-detail-redesign.mjs
      - run: npm run build
      - name: Create source archive
        run: git archive --format=zip --output=Wazir-Trading-Performance-Edition.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Wazir-Trading-Performance-Edition
          path: Wazir-Trading-Performance-Edition.zip
          if-no-files-found: error
          retention-days: 14
